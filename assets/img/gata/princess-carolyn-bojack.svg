<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgPC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0f7"/>
      <stop offset="100%" stop-color="#ffd1eb"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#4a154b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="url(#bgPC)" stroke="#d81b60" stroke-width="4"/>
  <rect x="8" y="8" width="384" height="384" rx="12" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Top Title Banner -->
  <rect x="30" y="20" width="340" height="36" rx="6" fill="#d81b60"/>
  <text x="200" y="43" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    ★ BOJACK HORSEMAN INSPIRATION ★
  </text>

  <!-- Princess Carolyn Character Illustration -->
  <g transform="translate(200, 195)">
    <!-- Pink Ears with Teal Earrings -->
    <!-- Left Ear -->
    <polygon points="-55,-60 -75,-120 -25,-85" fill="#ff80ab" stroke="#4a154b" stroke-width="3"/>
    <polygon points="-52,-65 -68,-110 -30,-85" fill="#ffb6c1"/>
    <circle cx="-72" cy="-115" r="5" fill="#ffd700" stroke="#4a154b" stroke-width="1.5"/>

    <!-- Right Ear -->
    <polygon points="55,-60 75,-120 25,-85" fill="#ff80ab" stroke="#4a154b" stroke-width="3"/>
    <polygon points="52,-65 68,-110 30,-85" fill="#ffb6c1"/>
    <circle cx="72" cy="-115" r="5" fill="#ffd700" stroke="#4a154b" stroke-width="1.5"/>

    <!-- Swirly Pink Hair -->
    <path d="M -45 -85 C -35 -115 35 -115 45 -85 C 60 -75 60 -50 45 -55 C 30 -60 -30 -60 -45 -55 Z" fill="#ff4081" stroke="#4a154b" stroke-width="2.5"/>
    <circle cx="-15" cy="-90" r="10" fill="#ff4081"/>
    <circle cx="15" cy="-90" r="10" fill="#ff4081"/>
    <circle cx="0" cy="-95" r="12" fill="#ff4081"/>

    <!-- Cat Head (Pink Persian Cat) -->
    <ellipse cx="0" cy="-35" rx="55" ry="50" fill="#ff80ab" stroke="#4a154b" stroke-width="3"/>

    <!-- Green Eyes with Eyelashes -->
    <ellipse cx="-22" cy="-42" rx="14" ry="12" fill="#ffffff" stroke="#4a154b" stroke-width="2"/>
    <ellipse cx="22" cy="-42" rx="14" ry="12" fill="#ffffff" stroke="#4a154b" stroke-width="2"/>
    <ellipse cx="-20" cy="-42" rx="8" ry="9" fill="#00b4d8"/>
    <ellipse cx="20" cy="-42" rx="8" ry="9" fill="#00b4d8"/>
    <circle cx="-20" cy="-42" r="4" fill="#000000"/>
    <circle cx="20" cy="-42" r="4" fill="#000000"/>
    <circle cx="-23" cy="-45" r="2.5" fill="#ffffff"/>
    <circle cx="17" cy="-45" r="2.5" fill="#ffffff"/>
    <!-- Eyelashes -->
    <path d="M -34 -48 L -42 -54 M -22 -54 L -22 -62 M -10 -50 L -4 -56" stroke="#4a154b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 34 -48 L 42 -54 M 22 -54 L 22 -62 M 10 -50 L 4 -56" stroke="#4a154b" stroke-width="2" stroke-linecap="round"/>

    <!-- Pink Nose & Whiskers -->
    <polygon points="-5,-24 5,-24 0,-18" fill="#d81b60"/>
    <path d="M -8 -16 Q 0 -10 8 -16" fill="none" stroke="#4a154b" stroke-width="2" stroke-linecap="round"/>
    <line x1="-30" y1="-20" x2="-65" y2="-24" stroke="#4a154b" stroke-width="1.5"/>
    <line x1="-30" y1="-14" x2="-62" y2="-12" stroke="#4a154b" stroke-width="1.5"/>
    <line x1="30" y1="-20" x2="65" y2="-24" stroke="#4a154b" stroke-width="1.5"/>
    <line x1="30" y1="-14" x2="62" y2="-12" stroke="#4a154b" stroke-width="1.5"/>

    <!-- Yellow Pearl Necklace -->
    <g fill="#ffd700" stroke="#b8860b" stroke-width="1">
      <circle cx="-30" cy="15" r="5"/>
      <circle cx="-18" cy="18" r="5"/>
      <circle cx="-6" cy="20" r="5.5"/>
      <circle cx="6" cy="20" r="5.5"/>
      <circle cx="18" cy="18" r="5"/>
      <circle cx="30" cy="15" r="5"/>
    </g>

    <!-- Iconic Teal Dress with Fish Pattern -->
    <path d="M -45 22 L -65 110 L 65 110 L 45 22 Q 0 35 -45 22 Z" fill="#00a896" stroke="#028090" stroke-width="3"/>
    <!-- Yellow fish patterns on dress -->
    <g fill="#ffea79">
      <ellipse cx="-25" cy="50" rx="8" ry="4"/>
      <polygon points="-17,50 -12,46 -12,54"/>
      
      <ellipse cx="15" cy="65" rx="8" ry="4"/>
      <polygon points="23,65 28,61 28,69"/>
      
      <ellipse cx="-15" cy="85" rx="8" ry="4"/>
      <polygon points="-7,85 -2,81 -2,89"/>
      
      <ellipse cx="25" cy="95" rx="8" ry="4"/>
      <polygon points="33,95 38,91 38,99"/>
    </g>

    <!-- Gold Cardigan / Sweater -->
    <path d="M -45 22 L -65 110 L -50 110 L -30 30 Z" fill="#ffd166" stroke="#e09f3e" stroke-width="2"/>
    <path d="M 45 22 L 65 110 L 50 110 L 30 30 Z" fill="#ffd166" stroke="#e09f3e" stroke-width="2"/>
  </g>

  <!-- Bottom Name Badge -->
  <rect x="40" y="335" width="320" height="44" rx="8" fill="#ffffff" stroke="#d81b60" stroke-width="2.5"/>
  <text x="200" y="358" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#880e4f" text-anchor="middle">
    ★ PRINCESS CAROLYN ★
  </text>
  <text x="200" y="372" font-family="sans-serif" font-size="10" fill="#666666" text-anchor="middle">
    "Always lands on her feet" • BoJack Horseman
  </text>
</svg>