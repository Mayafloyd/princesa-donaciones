<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 460" width="100%" height="100%">
  <defs>
    <!-- Liquid gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4081"/>
      <stop offset="50%" stop-color="#ff77a9"/>
      <stop offset="100%" stop-color="#d81b60"/>
    </linearGradient>
    <!-- Glass reflection -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff007f" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Potion Cork / Top Cap (Center tube is at X = 120, width = 80 -> x=80 to x=160) -->
  <path d="M 90 45 L 95 24 L 145 24 L 150 45 Z" fill="#d4a373" stroke="#8d5b4c" stroke-width="2"/>
  <!-- Ribbon around cork -->
  <rect x="92" y="38" width="56" height="9" rx="3" fill="#ff007f"/>
  <circle cx="120" cy="42" r="5" fill="#ffffff"/>

  <!-- Glass Tube Outer (x=80, width=80, height=350, center=120) -->
  <rect x="80" y="45" width="80" height="350" rx="40" fill="#fff5fa" stroke="#4a154b" stroke-width="4"/>
  
  <!-- Liquid Fill (50% level = y: 220 to 395) -->
  <clipPath id="tubeClipWide">
    <rect x="82" y="47" width="76" height="344" rx="38"/>
  </clipPath>
  
  <g clip-path="url(#tubeClipWide)">
    <!-- Liquid Body -->
    <rect x="80" y="215" width="80" height="185" fill="url(#liquidGrad)" filter="url(#neonGlow)"/>
    
    <!-- Animated liquid waves surface -->
    <ellipse cx="120" cy="215" rx="40" ry="12" fill="#ff94c2"/>
    
    <!-- Liquid Bubbles -->
    <circle cx="105" cy="340" r="6" fill="#ffffff" opacity="0.7"/>
    <circle cx="125" cy="310" r="8" fill="#ffffff" opacity="0.6"/>
    <circle cx="110" cy="270" r="5" fill="#ffffff" opacity="0.8"/>
    <circle cx="135" cy="240" r="7" fill="#ffffff" opacity="0.7"/>
    <circle cx="100" cy="225" r="4" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Glass Highlights / Sheen -->
  <path d="M 88 75 L 88 355" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 98 85 L 98 340" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <rect x="80" y="45" width="80" height="350" rx="40" fill="url(#glassGrad)" pointer-events="none"/>

  <!-- Measurement Tick Marks on Tube -->
  <!-- 100% -->
  <line x1="150" y1="75" x2="168" y2="75" stroke="#4a154b" stroke-width="3"/>
  <!-- 75% -->
  <line x1="150" y1="145" x2="168" y2="145" stroke="#4a154b" stroke-width="3"/>
  <!-- 50% Current -->
  <line x1="145" y1="215" x2="175" y2="215" stroke="#ff007f" stroke-width="4"/>
  <!-- 25% -->
  <line x1="150" y1="285" x2="168" y2="285" stroke="#4a154b" stroke-width="3"/>

  <!-- LABELS ON THE RIGHT (Ample room from x=175 to 330) -->
  <!-- 100% -->
  <text x="178" y="72" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#880e4f">100%</text>
  <text x="178" y="86" font-family="sans-serif" font-size="10" font-weight="bold" fill="#555555">.900.000</text>

  <!-- 75% -->
  <text x="178" y="142" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#880e4f">75%</text>
  <text x="178" y="156" font-family="sans-serif" font-size="10" font-weight="bold" fill="#555555">.175.000</text>

  <!-- 50% GLOWING BADGE (x=175 to 330) -->
  <g transform="translate(172, 198)">
    <rect width="155" height="34" rx="6" fill="#ff007f" filter="url(#neonGlow)"/>
    <rect x="2" y="2" width="151" height="30" rx="4" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <text x="77" y="16" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">★ 50% ALCANZADO ★</text>
    <text x="77" y="28" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffeb3b" text-anchor="middle">¡.450.000 COP AQUÍ!</text>
  </g>

  <!-- 25% -->
  <text x="178" y="282" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#880e4f">25%</text>
  <text x="178" y="296" font-family="sans-serif" font-size="10" font-weight="bold" fill="#555555">25.000</text>

  <!-- CAT MASCOT HUGGING TUBE ON THE LEFT (Ample room from x=10 to 80) -->
  <g transform="translate(80, 205)">
    <!-- Paws hugging the tube -->
    <ellipse cx="3" cy="10" rx="8" ry="6" fill="#1e1822" stroke="#ff77a9" stroke-width="1.5"/>
    <ellipse cx="78" cy="10" rx="8" ry="6" fill="#1e1822" stroke="#ff77a9" stroke-width="1.5"/>
    
    <!-- Cat Head peeking -->
    <ellipse cx="-24" cy="-5" rx="22" ry="20" fill="#1e1822" stroke="#ff94c2" stroke-width="1.5"/>
    <!-- Ears -->
    <polygon points="-40,-12 -42,-34 -26,-18" fill="#1e1822"/>
    <polygon points="-38,-14 -40,-30 -28,-18" fill="#ff80ab"/>
    <polygon points="-18,-20 -8,-34 -10,-12" fill="#1e1822"/>
    <polygon points="-16,-18 -9,-30 -11,-14" fill="#ff80ab"/>
    <!-- Big Yellow Eyes (Meme style) -->
    <ellipse cx="-31" cy="-6" rx="6" ry="8" fill="#ffeb3b"/>
    <ellipse cx="-17" cy="-6" rx="6" ry="8" fill="#ffeb3b"/>
    <circle cx="-31" cy="-6" r="3" fill="#000000"/>
    <circle cx="-17" cy="-6" r="3" fill="#000000"/>
    <circle cx="-33" cy="-8" r="2" fill="#ffffff"/>
    <circle cx="-19" cy="-8" r="2" fill="#ffffff"/>
    <!-- Nose & Blush -->
    <polygon points="-25,-1 -23,-1 -24,2" fill="#ff80ab"/>
    <ellipse cx="-34" cy="2" rx="4" ry="2.5" fill="#ff4081" opacity="0.7"/>
    <ellipse cx="-14" cy="2" rx="4" ry="2.5" fill="#ff4081" opacity="0.7"/>
    
    <!-- Floating Sparkle Heart above cat -->
    <text x="-24" y="-38" font-size="16" text-anchor="middle">💖</text>
  </g>

  <!-- Bottom Wooden Stand / Base (Centered around x=120) -->
  <path d="M 60 390 L 180 390 L 195 418 L 45 418 Z" fill="#d4a373" stroke="#8d5b4c" stroke-width="3"/>
  <rect x="55" y="418" width="130" height="10" rx="3" fill="#b08968" stroke="#8d5b4c" stroke-width="2"/>
</svg>